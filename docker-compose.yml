# docker compose up --build   ->  API on http://localhost:8000, UI on http://localhost:8501
# Ollama runs on the host (ollama serve; ollama pull qwen2.5:7b-instruct); containers reach it via host.docker.internal.
# Shell variables override the LLM settings without editing this file, e.g.
#   MOCK_LLM=true docker compose up -d                                   (no Ollama needed)
#   OLLAMA_BASE_URL_DOCKER=http://host.docker.internal:11435 OLLAMA_MODEL=qwen2.5-coder:7b docker compose up -d
#
# Storage:
#   - named volume insightdesk-data at /data holds Chroma and SQLite, so restarts never re-ingest or lose handoffs.
#   - ./data is bind-mounted read-write at /app/data: live /ingest files (data/kb/ingested/) land on the host,
#     and judge CSV folders dropped under ./data are visible to the loader:
#       docker compose exec api python scripts/load_accounts.py --dir data/test_accounts/
#
# Resilience: both services restart by themselves after a crash or a Docker Desktop restart (unless stopped
# with docker compose stop/down). Memory caps leave room in the shared WSL2 VM for a local Ollama model.
services:
  api:
    build: .
    image: insightdesk:latest
    # First start of a fresh volume (no SQLite file yet) also loads our accounts from data/accounts.
    # Later restarts skip it, so judge data loaded at runtime is never overwritten; the KB ingest skips itself too.
    command: ["sh", "-c", "[ -f \"$$SQLITE_PATH\" ] || python scripts/load_accounts.py --dir data/accounts > /dev/null;
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 75"]
    env_file:
      - path: .env          # optional: EMBED_MODEL, TOP_K, cloud fallback keys
        required: false
    environment:            # these override anything in .env
      MOCK_LLM: ${MOCK_LLM:-false}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-cloudflow-demo}   # web-app sign-in (same demo value as .env.example)
      CHROMA_DIR: /data/chroma
      SQLITE_PATH: /data/insightdesk.db
    ports:
      - "8000:8000"
    volumes:
      - insightdesk-data:/data
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    mem_limit: 3g
    stop_grace_period: 30s
    # Docker never kills an unhealthy container; the healthcheck only gates the UI start.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s   # first start ingests the whole KB (measured: see README Docker section)

  ui:
    build: .               # same image as api; the second build is fully cached
    image: insightdesk:latest
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped
    init: true
    mem_limit: 1g
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  insightdesk-data:
